name: 'Claude Code Multi-Provider Runner'
description: 'Run Claude Code on Anthropic, DeepSeek, Kimi, Z.AI/GLM or any compatible provider, with model-tier and caller-supplied tool presets.'

branding:
  icon: cpu
  color: blue

# Domain-agnostic wrapper around anthropics/claude-code-action. It selects the
# provider (Anthropic / DeepSeek / Kimi / Z.AI / any Anthropic-compatible
# endpoint), resolves the model for the requested tier, and applies an
# --allowedTools value. Tool presets are NOT baked in: pass a JSON
# `allowed_tools_preset_map` and reference its keys via `allowed_tools_preset`,
# so the action carries no project-specific allowlists.
#
# Compatible providers (DeepSeek, Kimi, Z.AI) authenticate with
# ANTHROPIC_AUTH_TOKEN against their Anthropic-compatible base URLs.

inputs:
  provider:
    description: 'Provider name (anthropic, deepseek, kimi, moonshot, zai, z.ai, or glm)'
    required: false
    default: ''
  claude-oauth-token:
    description: 'Anthropic OAuth token for Claude Code'
    required: false
    default: ''
  anthropic-api-key:
    description: 'Anthropic API key for Claude Code'
    required: false
    default: ''
  deepseek-api-key:
    description: 'DeepSeek API key for deepseek provider mode'
    required: false
    default: ''
  kimi-api-key:
    description: 'Kimi/Moonshot API key for kimi provider mode'
    required: false
    default: ''
  zai-api-key:
    description: 'Z.AI API key for zai/glm provider mode'
    required: false
    default: ''
  anthropic-base-url:
    description: 'Anthropic-compatible base URL'
    required: false
    default: ''
  deepseek-base-url:
    description: 'DeepSeek Anthropic-compatible base URL'
    required: false
    default: 'https://api.deepseek.com/anthropic'
  kimi-base-url:
    description: 'Kimi/Moonshot Anthropic-compatible base URL'
    required: false
    default: 'https://api.moonshot.ai/anthropic'
  zai-base-url:
    description: 'Z.AI Anthropic-compatible base URL'
    required: false
    default: 'https://api.z.ai/api/anthropic'
  claude-opus-model:
    description: 'Anthropic model name for Opus-tier runs'
    required: false
    default: ''
  claude-sonnet-model:
    description: 'Anthropic model name for Sonnet-tier runs'
    required: false
    default: ''
  deepseek-opus-model:
    description: >-
      DeepSeek model for Opus-tier runs. Default deepseek-v4-pro[1m] per
      https://api-docs.deepseek.com/quick_start/agent_integrations/claude_code/
    required: false
    default: ''
  deepseek-sonnet-model:
    description: >-
      DeepSeek model for Sonnet-tier runs. Default deepseek-v4-pro[1m]; set to
      deepseek-v4-flash for cheaper/faster CI.
    required: false
    default: ''
  deepseek-flash-model:
    description: >-
      DeepSeek model for Haiku-tier and sub-agent work. Default deepseek-v4-flash
      per the DeepSeek Claude Code guide.
    required: false
    default: ''
  kimi-opus-model:
    description: >-
      Kimi model for Opus-tier runs. Claude Code IDs: kimi-k3[1m] (default),
      kimi-k2.7-code, kimi-k2.7-code-highspeed, kimi-k2.6. Do not use deprecated
      kimi-k2-*-preview IDs.
    required: false
    default: ''
  kimi-sonnet-model:
    description: >-
      Kimi model for Sonnet-tier runs. Same IDs as kimi-opus-model; default
      kimi-k3[1m]. Prefer kimi-k2.7-code for cheaper/faster coding CI.
    required: false
    default: ''
  zai-opus-model:
    description: >-
      Z.AI/GLM model for Opus-tier runs. Default glm-5.2[1m] per
      https://docs.z.ai/devpack/latest-model
    required: false
    default: ''
  zai-sonnet-model:
    description: >-
      Z.AI/GLM model for Sonnet-tier runs. Default glm-5.2[1m]; set to glm-4.7
      for cheaper CI.
    required: false
    default: ''
  zai-haiku-model:
    description: >-
      Z.AI/GLM model for Haiku-tier and sub-agent work. Default glm-4.7 (Coding
      Plan allowed models are glm-5.2, glm-5-turbo, glm-4.7).
    required: false
    default: ''
  model-tier:
    description: 'Model tier to select: opus or sonnet'
    required: false
    default: opus

  allowed-bots:
    description: 'Allowed bots override.'
    required: false
    default: 'claude,chatgpt-codex-connector,cursor[bot],cursor,copilot-pull-request-reviewer'
  allowed_tools:
    description: 'Optional --allowedTools value applied by default. Takes precedence over allowed_tools_preset.'
    required: false
    default: ''
  allowed_tools_preset:
    description: 'Key looked up in allowed_tools_preset_map. Ignored when allowed_tools is set.'
    required: false
    default: ''
  allowed_tools_preset_map:
    description: 'Caller-supplied JSON object mapping preset names to --allowedTools strings, e.g. {"my-fix":"Edit,Read,Bash(make *)"}. The action ships no presets of its own.'
    required: false
    default: ''
  allowed_tools_preset_map_file:
    description: 'Path to a JSON file holding the preset map (used when allowed_tools_preset_map is empty), e.g. .github/allowed-tools.json.'
    required: false
    default: ''

  branch-name-template:
    description: 'Branch-name template for the checkout branch.'
    required: false
    default: ''
  bot-id:
    description: 'GitHub user ID to use for git operations.'
    required: false
    default: '41898282'
  bot-name:
    description: 'GitHub username to use for git operations.'
    required: false
    default: 'claude[bot]'

  additional-permissions:
    description: 'Additional permissions for the Claude bot.'
    required: false
    default: ''

  plugin_marketplaces:
    description: 'Plugin marketplaces.'
    required: false
    default: ''

  plugins:
    description: 'Plugins loaded into Claude Code.'
    required: false
    default: ''

  prompt:
    description: 'Prompt for Claude Code.'
    required: false
    default: ''

  claude-prompt-file:
    description: 'Path to a prompt file for Claude Code.'
    required: false
    default: ''

  claude-prompt-context:
    description: 'Optional context to append to the selected prompt.'
    required: false
    default: ''

  system-prompt:
    description: 'Optional system prompt to inject via appendSystemPrompt.'
    required: false
    default: ''
  system-prompt-file:
    description: 'Optional path to a system-prompt file.'
    required: false
    default: ''

  claude_args:
    description: 'Additional claude args. The action prepends --model automatically.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Resolve Claude provider settings
      id: resolve
      shell: bash
      env:
        INPUT_PROVIDER: ${{ inputs['provider'] }}
        INPUT_CLAUDE_OAUTH_TOKEN: ${{ inputs['claude-oauth-token'] }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs['anthropic-api-key'] }}
        INPUT_DEEPSEEK_API_KEY: ${{ inputs['deepseek-api-key'] }}
        INPUT_KIMI_API_KEY: ${{ inputs['kimi-api-key'] }}
        INPUT_ZAI_API_KEY: ${{ inputs['zai-api-key'] }}
        INPUT_ANTHROPIC_BASE_URL: ${{ inputs['anthropic-base-url'] }}
        INPUT_DEEPSEEK_BASE_URL: ${{ inputs['deepseek-base-url'] }}
        INPUT_KIMI_BASE_URL: ${{ inputs['kimi-base-url'] }}
        INPUT_ZAI_BASE_URL: ${{ inputs['zai-base-url'] }}
        INPUT_CLAUDE_OPUS_MODEL: ${{ inputs['claude-opus-model'] }}
        INPUT_CLAUDE_SONNET_MODEL: ${{ inputs['claude-sonnet-model'] }}
        INPUT_DEEPSEEK_OPUS_MODEL: ${{ inputs['deepseek-opus-model'] }}
        INPUT_DEEPSEEK_SONNET_MODEL: ${{ inputs['deepseek-sonnet-model'] }}
        INPUT_DEEPSEEK_FLASH_MODEL: ${{ inputs['deepseek-flash-model'] }}
        INPUT_KIMI_OPUS_MODEL: ${{ inputs['kimi-opus-model'] }}
        INPUT_KIMI_SONNET_MODEL: ${{ inputs['kimi-sonnet-model'] }}
        INPUT_ZAI_OPUS_MODEL: ${{ inputs['zai-opus-model'] }}
        INPUT_ZAI_SONNET_MODEL: ${{ inputs['zai-sonnet-model'] }}
        INPUT_ZAI_HAIKU_MODEL: ${{ inputs['zai-haiku-model'] }}
        INPUT_MODEL_TIER: ${{ inputs['model-tier'] }}
        INPUT_ALLOWED_BOTS: ${{ inputs['allowed-bots'] }}
        INPUT_BRANCH_NAME_TEMPLATE: ${{ inputs['branch-name-template'] }}
        INPUT_BOT_ID: ${{ inputs['bot-id'] }}
        INPUT_BOT_NAME: ${{ inputs['bot-name'] }}
        INPUT_ADDITIONAL_PERMISSIONS: ${{ inputs['additional-permissions'] }}
        INPUT_PLUGIN_MARKETPLACES: ${{ inputs.plugin_marketplaces }}
        INPUT_PLUGINS: ${{ inputs['plugins'] }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_PROMPT_FILE: ${{ inputs['claude-prompt-file'] }}
        INPUT_PROMPT_CONTEXT: ${{ inputs['claude-prompt-context'] }}
        INPUT_ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        INPUT_ALLOWED_TOOLS_PRESET: ${{ inputs.allowed_tools_preset }}
        INPUT_ALLOWED_TOOLS_PRESET_MAP: ${{ inputs.allowed_tools_preset_map }}
        INPUT_ALLOWED_TOOLS_PRESET_MAP_FILE: ${{ inputs.allowed_tools_preset_map_file }}
        INPUT_SYSTEM_PROMPT: ${{ inputs['system-prompt'] }}
        INPUT_SYSTEM_PROMPT_FILE: ${{ inputs['system-prompt-file'] }}
        INPUT_CLAUDE_ARGS: ${{ inputs.claude_args }}
      run: |
        set -euo pipefail

        write_output() {
          local name="$1"
          local value="$2"
          local delimiter
          delimiter="__${name}_$(date +%s%N)__"
          {
            printf '%s<<%s\n' "$name" "$delimiter"
            printf '%s\n' "$value"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
        }

        # Append a token to claude_args on its own line, inserting a separating
        # newline only when claude_args already holds something.
        append_claude_arg() {
          if [ -n "$claude_args" ]; then
            claude_args="${claude_args}"$'\n'
          fi
          claude_args="${claude_args}$1"
        }

        provider="$INPUT_PROVIDER"
        provider="${provider,,}"
        provider="${provider:-anthropic}"
        model_tier="$INPUT_MODEL_TIER"
        model_tier="${model_tier:-opus}"

        claude_oauth_token_input="$INPUT_CLAUDE_OAUTH_TOKEN"
        if [ -z "$claude_oauth_token_input" ]; then
          claude_oauth_token_input="${CLAUDE_CODE_OAUTH_TOKEN-}"
        fi

        anthropic_api_key_input="$INPUT_ANTHROPIC_API_KEY"
        if [ -z "$anthropic_api_key_input" ]; then
          anthropic_api_key_input="${ANTHROPIC_API_KEY-}"
        fi

        deepseek_api_key_input="$INPUT_DEEPSEEK_API_KEY"
        if [ -z "$deepseek_api_key_input" ]; then
          deepseek_api_key_input="${DEEPSEEK_API_KEY-}"
        fi

        kimi_api_key_input="$INPUT_KIMI_API_KEY"
        if [ -z "$kimi_api_key_input" ]; then
          kimi_api_key_input="${KIMI_API_KEY-}"
        fi
        if [ -z "$kimi_api_key_input" ]; then
          kimi_api_key_input="${MOONSHOT_API_KEY-}"
        fi
        if [ -z "$kimi_api_key_input" ]; then
          kimi_api_key_input="${ANTHROPIC_AUTH_TOKEN-}"
        fi

        zai_api_key_input="$INPUT_ZAI_API_KEY"
        if [ -z "$zai_api_key_input" ]; then
          zai_api_key_input="${ZAI_API_KEY-}"
        fi
        if [ -z "$zai_api_key_input" ]; then
          zai_api_key_input="${Z_AI_API_KEY-}"
        fi
        if [ -z "$zai_api_key_input" ]; then
          zai_api_key_input="${GLM_API_KEY-}"
        fi

        # Normalize provider aliases.
        case "$provider" in
          moonshot) provider="kimi" ;;
          z.ai|glm) provider="zai" ;;
        esac

        claude_code_oauth_token=""
        anthropic_api_key=""
        # Compatible providers authenticate with ANTHROPIC_AUTH_TOKEN (Bearer).
        # Keep ANTHROPIC_API_KEY out of the subprocess env for those — the two
        # conflict. See DeepSeek / Kimi / Z.AI Claude Code guides.
        anthropic_api_key_env=""
        anthropic_auth_token=""
        anthropic_custom_headers=""
        auto_compact_window=""
        effort_level=""
        use_auth_token="false"
        model_flash=""
        api_timeout_ms=""
        disable_nonessential_traffic=""

        if [ "$provider" = "deepseek" ]; then
          # deepseek_api_key_input already folds in the DEEPSEEK_API_KEY env fallback.
          token="$deepseek_api_key_input"
          # Satisfy claude-code-action validation; real auth is AUTH_TOKEN.
          # https://api-docs.deepseek.com/quick_start/agent_integrations/claude_code/
          anthropic_api_key="$token"
          anthropic_auth_token="$token"
          anthropic_custom_headers="Authorization: Bearer ${token}"
          use_auth_token="true"

          model_opus="$INPUT_DEEPSEEK_OPUS_MODEL"
          if [ -z "$model_opus" ]; then
            model_opus="${DEEPSEEK_OPUS_MODEL:-deepseek-v4-pro[1m]}"
          fi

          model_sonnet="$INPUT_DEEPSEEK_SONNET_MODEL"
          if [ -z "$model_sonnet" ]; then
            model_sonnet="${DEEPSEEK_SONNET_MODEL:-deepseek-v4-pro[1m]}"
          fi

          model_flash="$INPUT_DEEPSEEK_FLASH_MODEL"
          if [ -z "$model_flash" ]; then
            model_flash="${DEEPSEEK_FLASH_MODEL:-deepseek-v4-flash}"
          fi

          base_url="$INPUT_DEEPSEEK_BASE_URL"
          if [ -z "$base_url" ]; then
            base_url="${DEEPSEEK_BASE_URL:-https://api.deepseek.com/anthropic}"
          fi

          effort_level="${CLAUDE_CODE_EFFORT_LEVEL:-max}"
        elif [ "$provider" = "kimi" ]; then
          token="$kimi_api_key_input"
          # Satisfy anthropics/claude-code-action validation (requires
          # anthropic_api_key or oauth), but authenticate via AUTH_TOKEN.
          anthropic_api_key="$token"
          anthropic_auth_token="$token"
          anthropic_custom_headers="Authorization: Bearer ${token}"
          use_auth_token="true"

          model_opus="$INPUT_KIMI_OPUS_MODEL"
          if [ -z "$model_opus" ]; then
            model_opus="${KIMI_OPUS_MODEL:-kimi-k3[1m]}"
          fi

          model_sonnet="$INPUT_KIMI_SONNET_MODEL"
          if [ -z "$model_sonnet" ]; then
            model_sonnet="${KIMI_SONNET_MODEL:-kimi-k3[1m]}"
          fi

          base_url="$INPUT_KIMI_BASE_URL"
          if [ -z "$base_url" ]; then
            base_url="${KIMI_BASE_URL:-https://api.moonshot.ai/anthropic}"
          fi

          effort_level="${CLAUDE_CODE_EFFORT_LEVEL:-max}"
        elif [ "$provider" = "zai" ]; then
          token="$zai_api_key_input"
          # https://docs.z.ai/devpack/tool/claude
          # https://docs.z.ai/devpack/latest-model
          anthropic_api_key="$token"
          anthropic_auth_token="$token"
          anthropic_custom_headers="Authorization: Bearer ${token}"
          use_auth_token="true"

          model_opus="$INPUT_ZAI_OPUS_MODEL"
          if [ -z "$model_opus" ]; then
            model_opus="${ZAI_OPUS_MODEL:-glm-5.2[1m]}"
          fi

          model_sonnet="$INPUT_ZAI_SONNET_MODEL"
          if [ -z "$model_sonnet" ]; then
            model_sonnet="${ZAI_SONNET_MODEL:-glm-5.2[1m]}"
          fi

          model_flash="$INPUT_ZAI_HAIKU_MODEL"
          if [ -z "$model_flash" ]; then
            model_flash="${ZAI_HAIKU_MODEL:-glm-4.7}"
          fi

          base_url="$INPUT_ZAI_BASE_URL"
          if [ -z "$base_url" ]; then
            base_url="${ZAI_BASE_URL:-https://api.z.ai/api/anthropic}"
          fi

          effort_level="${CLAUDE_CODE_EFFORT_LEVEL:-max}"
          api_timeout_ms="${API_TIMEOUT_MS:-3000000}"
          disable_nonessential_traffic="${CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:-1}"
        else
          token="$claude_oauth_token_input"
          if [ -z "$token" ]; then
            token="$anthropic_api_key_input"
          fi
          if [ -n "$claude_oauth_token_input" ]; then
            claude_code_oauth_token="$claude_oauth_token_input"
          else
            anthropic_api_key="$token"
            anthropic_api_key_env="$token"
          fi

          model_opus="$INPUT_CLAUDE_OPUS_MODEL"
          if [ -z "$model_opus" ]; then
            model_opus="${CLAUDE_OPUS_MODEL:-claude-opus-4-8}"
          fi

          model_sonnet="$INPUT_CLAUDE_SONNET_MODEL"
          if [ -z "$model_sonnet" ]; then
            model_sonnet="${CLAUDE_SONNET_MODEL:-claude-sonnet-5}"
          fi

          base_url="$INPUT_ANTHROPIC_BASE_URL"
          if [ -z "$base_url" ]; then
            base_url="${ANTHROPIC_BASE_URL:-}"
          fi
        fi

        if [ -z "$token" ]; then
          if [ "$provider" = "deepseek" ]; then
            echo "::error::DeepSeek provider requires deepseek-api-key or DEEPSEEK_API_KEY."
          elif [ "$provider" = "kimi" ]; then
            echo "::error::Kimi provider requires kimi-api-key, KIMI_API_KEY, MOONSHOT_API_KEY, or ANTHROPIC_AUTH_TOKEN."
          elif [ "$provider" = "zai" ]; then
            echo "::error::Z.AI provider requires zai-api-key, ZAI_API_KEY, Z_AI_API_KEY, or GLM_API_KEY."
          else
            echo "::error::Anthropic provider requires claude-oauth-token, anthropic-api-key, CLAUDE_CODE_OAUTH_TOKEN, or ANTHROPIC_API_KEY."
          fi
          exit 1
        fi

        allowed_bots="$INPUT_ALLOWED_BOTS"
        branch_name_template="$INPUT_BRANCH_NAME_TEMPLATE"
        bot_id="$INPUT_BOT_ID"
        bot_name="$INPUT_BOT_NAME"
        additional_permissions="$INPUT_ADDITIONAL_PERMISSIONS"
        plugin_marketplaces="$INPUT_PLUGIN_MARKETPLACES"
        plugins="$INPUT_PLUGINS"

        # Resolve --allowedTools. Precedence:
        #   explicit allowed_tools  ->  allowed_tools_preset_map[allowed_tools_preset]
        #   ->  CLAUDE_ALLOWED_TOOLS env  ->  empty.
        # The preset table is caller-supplied (allowed_tools_preset_map), so this
        # action stays domain-agnostic.
        allowed_tools="$INPUT_ALLOWED_TOOLS"
        allowed_tools_preset="$INPUT_ALLOWED_TOOLS_PRESET"
        preset_map="$INPUT_ALLOWED_TOOLS_PRESET_MAP"
        if [ -z "$preset_map" ] && [ -n "$INPUT_ALLOWED_TOOLS_PRESET_MAP_FILE" ]; then
          if [ ! -f "$INPUT_ALLOWED_TOOLS_PRESET_MAP_FILE" ]; then
            echo "::error::allowed_tools_preset_map_file not found: ${INPUT_ALLOWED_TOOLS_PRESET_MAP_FILE}"
            exit 1
          fi
          preset_map="$(cat "$INPUT_ALLOWED_TOOLS_PRESET_MAP_FILE")"
        fi
        if [ -z "$allowed_tools" ] && [ -n "$allowed_tools_preset" ]; then
          if [ -z "$preset_map" ]; then
            echo "::error::allowed_tools_preset='${allowed_tools_preset}' was given but allowed_tools_preset_map is empty. Pass a JSON map of preset names to --allowedTools strings."
            exit 1
          fi
          if ! allowed_tools="$(printf '%s' "$preset_map" | jq -er --arg k "$allowed_tools_preset" '.[$k]')"; then
            echo "::error::allowed_tools_preset '${allowed_tools_preset}' not found in allowed_tools_preset_map"
            exit 1
          fi
        fi
        if [ -z "$allowed_tools" ]; then
          allowed_tools="${CLAUDE_ALLOWED_TOOLS-}"
        fi

        system_prompt="$INPUT_SYSTEM_PROMPT"
        system_prompt_path=""
        if [ -z "$system_prompt" ]; then
          system_prompt_path="$INPUT_SYSTEM_PROMPT_FILE"
        fi
        if [ -n "$system_prompt_path" ]; then
          if [ ! -f "$system_prompt_path" ]; then
            echo "::error::System prompt file not found: ${system_prompt_path}"
            exit 1
          fi
          system_prompt="$(cat "$system_prompt_path")"
        fi
        if [ -z "$system_prompt" ] && [ -n "${CLAUDE_APPEND_SYSTEM_PROMPT-}" ]; then
          system_prompt="${CLAUDE_APPEND_SYSTEM_PROMPT}"
        fi
        if [ -n "$system_prompt" ]; then
          system_prompt="$(printf '%s' "$system_prompt" | tr '\n' ' ')"
        fi

        prompt="$INPUT_PROMPT"
        prompt_file="$INPUT_PROMPT_FILE"
        prompt_context="$INPUT_PROMPT_CONTEXT"

        if [ -z "$prompt" ] && [ -n "$prompt_file" ]; then
          if [ ! -f "$prompt_file" ]; then
            echo "::error::Prompt file not found: ${prompt_file}"
            exit 1
          fi
          prompt="$(cat "$prompt_file")"
        fi

        if [ -n "$prompt_context" ]; then
          if [ -n "$prompt" ]; then
            prompt="${prompt}"$'\n'"${prompt_context}"
          else
            prompt="$prompt_context"
          fi
        fi

        if [ -n "$prompt" ]; then
          prompt="$(printf '%s' "$prompt" | tr '\n' ' ')"
        fi

        claude_args="$INPUT_CLAUDE_ARGS"
        append_system_prompt=''
        if [ -n "$system_prompt" ] && ! printf '%s\n' "$claude_args" | grep -q -- '--append-system-prompt'; then
          append_system_prompt="$system_prompt"
          append_claude_arg "--append-system-prompt \"${append_system_prompt}\""
        fi
        if [ -n "$allowed_tools" ] && ! printf '%s\n' "$claude_args" | grep -q -- '--allowedTools'; then
          append_claude_arg "--allowedTools \"${allowed_tools}\""
        fi

        case "$model_tier" in
          sonnet)
            model="$model_sonnet"
            ;;
          *)
            model="$model_opus"
            ;;
        esac

        # Compatible providers: fill every Claude Code model-tier env so
        # background/sub-agent calls don't fall back to Anthropic model names.
        # Auth is ANTHROPIC_AUTH_TOKEN (Bearer).
        default_opus_model=""
        default_sonnet_model=""
        default_haiku_model=""
        default_fable_model=""
        subagent_model=""
        if [ "$provider" = "deepseek" ]; then
          # https://api-docs.deepseek.com/quick_start/agent_integrations/claude_code/
          default_opus_model="$model_opus"
          default_sonnet_model="$model_sonnet"
          default_haiku_model="$model_flash"
          default_fable_model="$model_flash"
          subagent_model="$model_flash"
          auto_compact_window="${CLAUDE_CODE_AUTO_COMPACT_WINDOW:-1048576}"
        elif [ "$provider" = "kimi" ]; then
          # https://platform.kimi.ai/docs/guide/claude-code-kimi
          default_opus_model="$model_opus"
          default_sonnet_model="$model_sonnet"
          default_haiku_model="$model"
          default_fable_model="$model"
          subagent_model="$model"

          auto_compact_window="${CLAUDE_CODE_AUTO_COMPACT_WINDOW-}"
          if [ -z "$auto_compact_window" ]; then
            case "$model" in
              *k2.7*|*k2.6*|*k2.5*)
                auto_compact_window="262144"
                ;;
              *)
                # kimi-k3 / kimi-k3[1m] and unknown ids → 1M (Claude Code guide).
                auto_compact_window="1048576"
                ;;
            esac
          fi
        elif [ "$provider" = "zai" ]; then
          # https://docs.z.ai/devpack/tool/claude
          # https://docs.z.ai/devpack/latest-model
          default_opus_model="$model_opus"
          default_sonnet_model="$model_sonnet"
          default_haiku_model="$model_flash"
          default_fable_model="$model_flash"
          subagent_model="$model_flash"
          # Z.AI docs use 1000000 (not 1048576) for the 1M compact window.
          auto_compact_window="${CLAUDE_CODE_AUTO_COMPACT_WINDOW:-1000000}"
        fi

        write_output claude_code_oauth_token "$claude_code_oauth_token"
        write_output anthropic_api_key "$anthropic_api_key"
        write_output anthropic_api_key_env "$anthropic_api_key_env"
        write_output anthropic_auth_token "$anthropic_auth_token"
        write_output anthropic_custom_headers "$anthropic_custom_headers"
        write_output use_auth_token "$use_auth_token"
        write_output base_url "$base_url"
        write_output model "$model"
        write_output model_tier "$model_tier"
        write_output provider "$provider"
        write_output default_opus_model "$default_opus_model"
        write_output default_sonnet_model "$default_sonnet_model"
        write_output default_haiku_model "$default_haiku_model"
        write_output default_fable_model "$default_fable_model"
        write_output subagent_model "$subagent_model"
        write_output auto_compact_window "$auto_compact_window"
        write_output effort_level "$effort_level"
        write_output api_timeout_ms "$api_timeout_ms"
        write_output disable_nonessential_traffic "$disable_nonessential_traffic"
        write_output allowed_bots "$allowed_bots"
        write_output branch_name_template "$branch_name_template"
        write_output bot_id "$bot_id"
        write_output bot_name "$bot_name"
        write_output additional_permissions "$additional_permissions"
        write_output plugin_marketplaces "$plugin_marketplaces"
        write_output plugins "$plugins"
        write_output prompt "$prompt"
        write_output claude_args "$claude_args"
        write_output append_system_prompt "$append_system_prompt"

    - name: Report provider and model
      shell: bash
      env:
        RESOLVED_PROVIDER: ${{ steps.resolve.outputs.provider }}
        RESOLVED_MODEL: ${{ steps.resolve.outputs.model }}
        RESOLVED_MODEL_TIER: ${{ steps.resolve.outputs.model_tier }}
      run: |
        set -euo pipefail
        echo "::notice title=Claude Code provider::provider=${RESOLVED_PROVIDER}, model=${RESOLVED_MODEL}, tier=${RESOLVED_MODEL_TIER}"
        {
          echo "### Claude Code provider"
          echo
          echo "- Provider: \`${RESOLVED_PROVIDER}\`"
          echo "- Model: \`${RESOLVED_MODEL}\`"
          echo "- Tier: \`${RESOLVED_MODEL_TIER}\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Run Claude Code
      if: steps.resolve.outputs.use_auth_token != 'true'
      uses: anthropics/claude-code-action@v1
      env:
        ANTHROPIC_BASE_URL: ${{ steps.resolve.outputs.base_url }}
        ANTHROPIC_API_KEY: ${{ steps.resolve.outputs.anthropic_api_key_env }}
      with:
        claude_code_oauth_token: ${{ steps.resolve.outputs.claude_code_oauth_token }}
        anthropic_api_key: ${{ steps.resolve.outputs.anthropic_api_key }}
        allowed_bots: ${{ steps.resolve.outputs.allowed_bots }}
        branch_name_template: ${{ steps.resolve.outputs.branch_name_template }}
        bot_id: ${{ steps.resolve.outputs.bot_id }}
        bot_name: ${{ steps.resolve.outputs.bot_name }}
        additional_permissions: ${{ steps.resolve.outputs.additional_permissions }}
        plugin_marketplaces: ${{ steps.resolve.outputs.plugin_marketplaces }}
        plugins: ${{ steps.resolve.outputs.plugins }}
        prompt: ${{ steps.resolve.outputs.prompt }}
        claude_args: |
          --model ${{ steps.resolve.outputs.model }}
          ${{ steps.resolve.outputs.claude_args }}

    # DeepSeek / Kimi / Z.AI need ANTHROPIC_AUTH_TOKEN (+ Bearer header) and
    # every model-tier env filled so sub-agents don't request Anthropic names.
    # Kept as a separate step so those vars are never set empty for Anthropic.
    - name: Run Claude Code (compatible provider)
      if: steps.resolve.outputs.use_auth_token == 'true'
      uses: anthropics/claude-code-action@v1
      env:
        ANTHROPIC_BASE_URL: ${{ steps.resolve.outputs.base_url }}
        ANTHROPIC_AUTH_TOKEN: ${{ steps.resolve.outputs.anthropic_auth_token }}
        ANTHROPIC_CUSTOM_HEADERS: ${{ steps.resolve.outputs.anthropic_custom_headers }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.resolve.outputs.default_opus_model }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.resolve.outputs.default_sonnet_model }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.resolve.outputs.default_haiku_model }}
        ANTHROPIC_DEFAULT_FABLE_MODEL: ${{ steps.resolve.outputs.default_fable_model }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.resolve.outputs.subagent_model }}
        CLAUDE_CODE_AUTO_COMPACT_WINDOW: ${{ steps.resolve.outputs.auto_compact_window }}
        CLAUDE_CODE_EFFORT_LEVEL: ${{ steps.resolve.outputs.effort_level }}
        API_TIMEOUT_MS: ${{ steps.resolve.outputs.api_timeout_ms }}
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: ${{ steps.resolve.outputs.disable_nonessential_traffic }}
      with:
        # Required by claude-code-action validation; real auth is AUTH_TOKEN.
        anthropic_api_key: ${{ steps.resolve.outputs.anthropic_api_key }}
        allowed_bots: ${{ steps.resolve.outputs.allowed_bots }}
        branch_name_template: ${{ steps.resolve.outputs.branch_name_template }}
        bot_id: ${{ steps.resolve.outputs.bot_id }}
        bot_name: ${{ steps.resolve.outputs.bot_name }}
        additional_permissions: ${{ steps.resolve.outputs.additional_permissions }}
        plugin_marketplaces: ${{ steps.resolve.outputs.plugin_marketplaces }}
        plugins: ${{ steps.resolve.outputs.plugins }}
        prompt: ${{ steps.resolve.outputs.prompt }}
        claude_args: |
          --model ${{ steps.resolve.outputs.model }}
          ${{ steps.resolve.outputs.claude_args }}
